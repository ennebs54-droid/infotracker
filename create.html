<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TrackSuite — Create Tracking ID</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/lucide.min.js"></script>
</head>
<body>

  <div class="bg-orb orb1"></div>
  <div class="bg-orb orb2"></div>
  <div class="bg-orb orb3"></div>

  <div class="page-shell">

    <nav class="navbar">
      <a href="index.html" class="nav-logo" style="text-decoration:none">
        <i data-lucide="package-2"></i>
        <span>TrackSuite</span>
      </a>
      <div class="nav-badge">Live Tracking</div>
    </nav>

    <header class="hero-section">
      <div class="hero-tag">
        <span class="tag-dot"></span>
        Global Shipment Creation
      </div>
      <h1>Create a new<br><span class="gradient-text">Tracking ID.</span></h1>
      <p class="hero-copy">Fill in the shipment details below. Once saved, anyone worldwide can look it up instantly.</p>

      <div class="search-panel">
        <form id="create-form" autocomplete="off">

          <div class="input-wrap">

            <div class="input-group">
              <span class="input-icon"><i data-lucide="hash"></i></span>
              <input id="newTrackId" type="text" placeholder="Tracking ID (e.g. TRK123456)" required />
            </div>

            <div class="input-group">
              <span class="input-icon"><i data-lucide="activity"></i></span>
              <select id="newStatus">
                <option>In Transit</option>
                <option>Processing</option>
                <option>Confirmed</option>
                <option>Awaiting Approval</option>
                <option>Out for Delivery</option>
                <option>Delivered</option>
              </select>
            </div>

            <div class="input-group">
              <span class="input-icon"><i data-lucide="truck"></i></span>
              <input id="newCourier" type="text" placeholder="Courier (e.g. Global Express)" />
            </div>

            <div class="input-group">
              <span class="input-icon"><i data-lucide="building-2"></i></span>
              <input id="newCompany" type="text" placeholder="Company / Carrier (e.g. FedEx Logistics)" />
            </div>

            <div class="input-group">
              <span class="input-icon"><i data-lucide="warehouse"></i></span>
              <input id="newOrigin" type="text" placeholder="Origin Address (e.g. New York, US)" />
            </div>

            <div class="input-group">
              <span class="input-icon"><i data-lucide="map-pin"></i></span>
              <input id="newLocation" type="text" placeholder="Current Location (e.g. Manchester, UK)" />
            </div>

            <div class="input-group">
              <span class="input-icon"><i data-lucide="calendar"></i></span>
              <input id="newDelivery" type="text" placeholder="Estimated Delivery Date (optional)" />
            </div>

            <div class="input-group">
              <span class="input-icon"><i data-lucide="message-square"></i></span>
              <input id="newUpdate" type="text" placeholder="Latest Update Message" />
            </div>

            <div class="input-group">
              <span class="input-icon"><i data-lucide="list-checks"></i></span>
              <input id="newProgress" type="text" placeholder="Progress Steps — comma separated (e.g. Ordered, Confirmed, Shipped)" />
            </div>

            <div class="input-group input-group--textarea">
              <span class="input-icon" style="align-self:flex-start;padding-top:2px"><i data-lucide="clock"></i></span>
              <textarea id="newTimeline" rows="4" placeholder="Timeline Events — one per line: Event | Note&#10;e.g. Departed facility | Package left the hub"></textarea>
            </div>

            <button type="submit" class="primary-btn">
              <span>Save Tracking ID</span>
              <i data-lucide="save"></i>
            </button>

          </div>
        </form>

        <div id="createMsg" class="status-message"></div>
        <div style="text-align:center;margin-top:16px">
          <a href="index.html" class="create-link">← Back to tracking</a>
        </div>
      </div>

      <div class="trust-bar">
        <div class="trust-item"><i data-lucide="shield-check"></i> Secure & Private</div>
        <div class="trust-divider"></div>
        <div class="trust-item"><i data-lucide="zap"></i> Instant Results</div>
        <div class="trust-divider"></div>
        <div class="trust-item"><i data-lucide="globe"></i> Worldwide Tracking</div>
      </div>
    </header>

    <footer class="footer">
      <p>© 2025 TrackSuite. All rights reserved.</p>
    </footer>

  </div>

  <script src="create.js"></script>
</body>
</html>
