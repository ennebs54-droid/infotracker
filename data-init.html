<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Initialize Tracking Data</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 40px; max-width: 600px; margin: 0 auto; }
    .container { background: #f5f5f5; padding: 20px; border-radius: 8px; }
    h1 { color: #333; }
    button { background: #2563eb; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 16px; }
    button:hover { background: #1d4ed8; }
    .success { color: #10b981; margin: 10px 0; }
    .info { color: #666; font-size: 14px; margin: 10px 0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Initialize Sample Tracking Data</h1>
    <p>Click the button below to add sample tracking data to your browser's local storage.</p>
    
    <button onclick="initializeData()">Initialize Sample Data</button>
    
    <div id="message"></div>
    <div class="info">This creates sample tracking records that you can view and edit in the app.</div>
  </div>

  <script>
    const STORAGE_KEY = 'tracking-data';

    const sampleData = {
      'GDY234923': {
        status: 'Awaiting Custom Approval',
        courier: 'DPD UK',
        company: 'FedEx',
        location: 'Manchester Distribution Centre, Manchester, UK',
        estimatedDelivery: 'Pending Approval',
        latestUpdate: 'Shipment is awaiting custom approval before proceeding.',
        originAddress: '42 Deansgate, Manchester, UK',
        progress: ['Ordered', 'Confirmed'],
        timeline: [
          { time: 'Today, 10:00 AM', event: 'Awaiting Approval', note: 'Shipment is awaiting custom approval before proceeding.' }
        ]
      },
      'DY234923': {
        status: 'Awaiting Custom Approval',
        courier: 'Custom Logistics',
        company: 'Custom Handler',
        location: 'Pending Location',
        estimatedDelivery: 'Pending Approval',
        latestUpdate: 'Shipment is awaiting custom approval before proceeding.',
        originAddress: 'Custom Shipment',
        progress: ['Ordered', 'Confirmed'],
        timeline: [
          { time: 'Today, 10:00 AM', event: 'Awaiting Approval', note: 'Shipment is awaiting custom approval before proceeding.' }
        ]
      },
      'TRKBU372': {
        status: 'In Transit',
        courier: 'Global Express',
        company: 'FedEx Logistics',
        location: 'Manchester, UK',
        estimatedDelivery: 'May 14, 2026',
        latestUpdate: 'Package departed sort facility and is en route to distribution center.',
        originAddress: '48 Willowbrook Lane, Manchester, UK',
        progress: ['Ordered', 'Confirmed', 'Shipped'],
        timeline: [
          { time: 'Today, 10:24 AM', event: 'Departed sort facility', note: 'Package is in transit to regional hub. Estimated next step in 1h 30m to 3h.' },
          { time: 'Yesterday, 7:12 PM', event: 'Shipment picked up', note: 'Pickup confirmed by courier partner.' },
          { time: 'Yesterday, 8:00 AM', event: 'Shipment processed', note: 'Shipment has entered the carrier network.' }
        ]
      },
      'MAN456789': {
        status: 'Awaiting Custom Approval',
        courier: 'DPD UK',
        company: 'FedEx',
        location: 'Manchester Distribution Centre, Manchester, UK',
        estimatedDelivery: 'Pending Approval',
        latestUpdate: 'Shipment is awaiting custom approval before proceeding.',
        originAddress: '42 Deansgate, Manchester, UK',
        progress: ['Ordered', 'Confirmed'],
        timeline: [
          { time: 'Today, 10:00 AM', event: 'Awaiting Approval', note: 'Shipment is awaiting custom approval before proceeding.' }
        ]
      }
    };

    function initializeData() {
      try {
        Object.entries(sampleData).forEach(([id, data]) => {
          localStorage.setItem(`${STORAGE_KEY}-${id}`, JSON.stringify(data));
        });
        document.getElementById('message').innerHTML = '<div class="success">✓ Sample data initialized successfully! You can now use the app.</div>';
      } catch (e) {
        document.getElementById('message').innerHTML = '<div style="color: red;">✗ Error: ' + e.message + '</div>';
      }
    }
  </script>
</body>
</html>
