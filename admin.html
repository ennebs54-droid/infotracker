<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TrackSuite — Admin Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="admin.css" />
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/lucide.min.js"></script>
</head>
<body>

  <div class="bg-orb orb1"></div>
  <div class="bg-orb orb2"></div>
  <div class="bg-orb orb3"></div>

  <div class="page-shell">

    <!-- Navbar -->
    <nav class="navbar">
      <div class="nav-logo">
        <i data-lucide="package-2"></i>
        <span>TrackSuite</span>
      </div>
      <div class="nav-badge admin-badge">
        <i data-lucide="shield"></i> Admin Panel
      </div>
    </nav>

    <!-- Header -->
    <header class="admin-header">
      <div class="hero-tag">
        <span class="tag-dot"></span>
        Management Console
      </div>
      <h1>Tracking <span class="gradient-text">Admin Panel</span></h1>
      <p class="hero-copy">Create and manage tracking IDs, set statuses, origins and current locations.</p>
    </header>

    <!-- Create New Tracking ID -->
    <div class="admin-container">
      <div class="admin-card">
        <div class="admin-card-header">
          <div class="card-icon-wrap"><i data-lucide="plus-circle"></i></div>
          <div>
            <p class="card-label">New Tracking ID</p>
            <h2 class="admin-card-title">Create Shipment</h2>
          </div>
        </div>

        <form id="adminForm" class="admin-form">

          <div class="form-row">
            <div class="form-group">
              <label>Tracking ID</label>
              <div class="input-group">
                <span class="input-icon"><i data-lucide="hash"></i></span>
                <input type="text" id="newTrackingId" placeholder="e.g. XYZ12345" />
              </div>
            </div>
            <div class="form-group">
              <label>Courier</label>
              <div class="input-group">
                <span class="input-icon"><i data-lucide="truck"></i></span>
                <input type="text" id="newCourier" placeholder="e.g. Global Express" />
              </div>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Origin Address</label>
              <div class="input-group">
                <span class="input-icon"><i data-lucide="warehouse"></i></span>
                <input type="text" id="newOrigin" placeholder="e.g. Manchester, UK" />
              </div>
            </div>
            <div class="form-group">
              <label>Current Location</label>
              <div class="input-group">
                <span class="input-icon"><i data-lucide="map-pin"></i></span>
                <input type="text" id="newLocation" placeholder="e.g. Dubai, UAE" />
              </div>
            </div>
          </div>

          <div class="form-group">
            <label>Status</label>
            <div class="status-options">
              <label class="status-option">
                <input type="radio" name="status" value="Approved" />
                <span class="status-pill approved">Approved</span>
              </label>
              <label class="status-option">
                <input type="radio" name="status" value="Not Approved" />
                <span class="status-pill not-approved">Not Approved</span>
              </label>
              <label class="status-option">
                <input type="radio" name="status" value="In Transit" checked />
                <span class="status-pill in-transit">In Transit</span>
              </label>
              <label class="status-option">
                <input type="radio" name="status" value="Awaiting Approval" />
                <span class="status-pill awaiting">Awaiting Approval</span>
              </label>
              <label class="status-option">
                <input type="radio" name="status" value="Delivered" />
                <span class="status-pill delivered">Delivered</span>
              </label>
              <label class="status-option">
                <input type="radio" name="status" value="Out for Delivery" />
                <span class="status-pill out-delivery">Out for Delivery</span>
              </label>
              <label class="status-option custom-status-option">
                <input type="radio" name="status" value="custom" />
                <span class="status-pill custom">Custom...</span>
              </label>
            </div>
            <div class="input-group" id="customStatusWrap" style="display:none;margin-top:12px;">
              <span class="input-icon"><i data-lucide="pen-line"></i></span>
              <input type="text" id="customStatus" placeholder="Enter custom status..." />
            </div>
          </div>

          <div class="form-group">
            <label>Latest Update Message</label>
            <div class="input-group">
              <span class="input-icon"><i data-lucide="message-square"></i></span>
              <input type="text" id="newUpdate" placeholder="e.g. Package has cleared customs and is on its way." />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Progress Stage</label>
              <div class="input-group">
                <span class="input-icon"><i data-lucide="git-branch"></i></span>
                <select id="newProgress">
                  <option value="1">Ordered</option>
                  <option value="2">Confirmed</option>
                  <option value="3" selected>Shipped</option>
                  <option value="4">Out for Delivery</option>
                  <option value="5">Delivered</option>
                </select>
              </div>
            </div>
            <div class="form-group">
              <label>Use IP for Location?</label>
              <div class="input-group toggle-wrap">
                <span class="input-icon"><i data-lucide="globe"></i></span>
                <span class="toggle-label">Auto-detect visitor's country</span>
                <label class="toggle">
                  <input type="checkbox" id="useIpLocation" />
                  <span class="toggle-slider"></span>
                </label>
              </div>
            </div>
          </div>

          <div id="adminFormMsg" class="admin-msg"></div>
          <button type="submit" class="primary-btn admin-submit-btn">
            <i data-lucide="plus"></i>
            <span>Create Tracking ID</span>
          </button>
        </form>
      </div>

      <!-- Existing Tracking IDs -->
      <div class="admin-card">
        <div class="admin-card-header">
          <div class="card-icon-wrap"><i data-lucide="list"></i></div>
          <div>
            <p class="card-label">All Tracking IDs</p>
            <h2 class="admin-card-title">Manage Shipments</h2>
          </div>
        </div>
        <div id="trackingList" class="tracking-list"></div>
      </div>
    </div>

    <footer class="footer">
      <p>© 2025 TrackSuite Admin. Restricted Access.</p>
    </footer>

  </div>

  <script src="admin.js"></script>
  <script>window.addEventListener('load', () => lucide.replace())</script>
</body>
</html>
