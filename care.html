<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Customer Care — TrackSuite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.1/dist/lucide.min.js"></script>
  <style>
    .care-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      position: relative;
      z-index: 1;
      text-align: center;
    }
    .care-icon {
      width: 72px;
      height: 72px;
      background: rgba(79,163,255,0.12);
      border: 1px solid rgba(79,163,255,0.25);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      color: var(--primary);
    }
    .care-shell h1 {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #ffffff 0%, #c8ddff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .care-shell p {
      font-size: 15px;
      color: var(--muted);
      margin-bottom: 32px;
      line-height: 1.7;
    }
    .open-chat-btn {
      padding: 16px 40px;
      background: linear-gradient(135deg, #4fa3ff 0%, #2979e8 100%);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(79,163,255,0.35);
      transition: var(--transition);
    }
    .open-chat-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(79,163,255,0.5); }
    .back-link {
      display: inline-block;
      margin-top: 20px;
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
      text-decoration: none;
      transition: var(--transition);
    }
    .back-link:hover { color: var(--text); }
  </style>
</head>
<body>
  <div class="care-shell">
    <div class="care-icon">
      <i data-lucide="message-circle" style="width:32px;height:32px;"></i>
    </div>
    <h1>Customer Care</h1>
    <p>Our support team is online and ready to help.<br>Tap below to start a live chat.</p>
    <button class="open-chat-btn" onclick="openChat()">💬 Start Live Chat</button>
    <a class="back-link" onclick="history.back()">← Go Back</a>
  </div>

  <!--Start of Tawk.to Script-->
  <script type="text/javascript">
    var Tawk_API=Tawk_API||{}, Tawk_LoadStart=new Date();
    (function(){
      var s1=document.createElement("script"),s0=document.getElementsByTagName("script")[0];
      s1.async=true;
      s1.src='https://embed.tawk.to/6a6e44a1055f021d4ace17fe/1juvbo6d8';
      s1.charset='UTF-8';
      s1.setAttribute('crossorigin','*');
      s0.parentNode.insertBefore(s1,s0);
    })();
  </script>
  <!--End of Tawk.to Script-->

  <script>
    function openChat() {
      if (window.Tawk_API && window.Tawk_API.maximize) {
        Tawk_API.maximize();
      }
    }

    // Auto-open chat once Tawk.to is ready
    var Tawk_API = Tawk_API || {};
    Tawk_API.onLoad = function() {
      Tawk_API.maximize();
    };

    document.addEventListener('DOMContentLoaded', () => { if (window.lucide) lucide.replace(); });
    window.addEventListener('load', () => { if (window.lucide) lucide.replace(); });
  </script>
</body>
</html>
