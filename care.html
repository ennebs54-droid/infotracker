<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FedEx — Customer Support</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.1/dist/lucide.min.js"></script>
  <style>
    body { background: #f2f2f7; font-family: 'Inter', sans-serif; color: #111; }
    .fdx-nav { background: #4d148c; padding: 0 40px; height: 58px; display: flex; align-items: center; }
    .fdx-logo { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; text-decoration: none; line-height: 1; }
    .fdx-logo .fed { color: #fff; }
    .fdx-logo .ex  { color: #ff6200; }
    .care-shell { min-height: calc(100vh - 58px); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; text-align: center; }
    .care-icon { width: 68px; height: 68px; background: rgba(77,20,140,0.08); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; color: #4d148c; }
    .care-shell h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 10px; color: #111; }
    .care-shell p { font-size: 15px; color: #888; margin-bottom: 28px; line-height: 1.7; }
    .open-chat-btn { padding: 14px 36px; background: #ff6200; color: #fff; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 4px 16px rgba(255,98,0,0.25); }
    .open-chat-btn:hover { background: #e55a00; transform: translateY(-1px); }
    .back-link { display: inline-block; margin-top: 18px; font-size: 13px; color: #4d148c; cursor: pointer; text-decoration: none; }
    .back-link:hover { text-decoration: underline; }
    @media (max-width: 520px) { .fdx-nav { padding: 0 20px; } }
  </style>
</head>
<body>
  <nav class="fdx-nav">
    <a class="fdx-logo" href="index.html"><span class="fed">Fed</span><span class="ex">Ex</span></a>
  </nav>
  <div class="care-shell">
    <div class="care-icon">
      <i data-lucide="message-circle" style="width:32px;height:32px;"></i>
    </div>
    <h1>Customer Care</h1>
    <p>Our support team is online and ready to help.<br>Tap below to start a live chat.</p>
    <button class="open-chat-btn" onclick="openChat()">💬 Start Live Chat</button>
    <a class="back-link" onclick="history.back()">← Go Back</a>
  </div>

  <!--Start of Tawk.to Script-->
  <script type="text/javascript">
    var Tawk_API=Tawk_API||{}, Tawk_LoadStart=new Date();
    (function(){
      var s1=document.createElement("script"),s0=document.getElementsByTagName("script")[0];
      s1.async=true;
      s1.src='https://embed.tawk.to/6a6e44a1055f021d4ace17fe/1juvbo6d8';
      s1.charset='UTF-8';
      s1.setAttribute('crossorigin','*');
      s0.parentNode.insertBefore(s1,s0);
    })();
  </script>
  <!--End of Tawk.to Script-->

  <script>
    function openChat() {
      if (window.Tawk_API && window.Tawk_API.maximize) {
        Tawk_API.maximize();
      }
    }

    // Auto-open chat once Tawk.to is ready
    var Tawk_API = Tawk_API || {};
    Tawk_API.onLoad = function() {
      Tawk_API.maximize();
    };

    document.addEventListener('DOMContentLoaded', () => { if (window.lucide) lucide.replace(); });
    window.addEventListener('load', () => { if (window.lucide) lucide.replace(); });
  </script>
</body>
</html>
